[workspace]
members = [".", "crates/*"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
libc = "=0.2.189"
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime", "prettyplease"] }
bytemuck = { version = "1", features = ["derive"] }
dma-buf = { path = "crates/dma-buf" }
rkmpp = { path = "crates/rkmpp" }
codec-parser = { path = "crates/codec-parser" }
rkmpp-bridge-uapi = { path = "crates/rkmpp-bridge-uapi" }

[profile.dev.build-override]
debug = true

[package]
name = "v4l2-stateful-rkmpp"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
rkmpp-bridge-uapi.workspace = true
rkmpp.workspace = true
codec-parser.workspace = true
dma-buf.workspace = true
ash = { version = "0.38.0", default-features = false, features = ["linked", "std", "debug"] }
libc.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "time", "sync", "io-util"] }

[[bin]]
name = "v4l2-stateful-rkmpp"
path = "src/main.rs"
