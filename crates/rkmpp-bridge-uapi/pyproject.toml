[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rkmpp-bridge-uapi"
version = "0.1.0"
requires-python = ">=3.14"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "rkmpp_bridge_uapi.pyi" },
    { file = "../../kernel/bridge_uapi.h" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "build.rs" },
]

[tool.maturin]
profile = "dev"
module-name = "rkmpp_bridge_uapi"
